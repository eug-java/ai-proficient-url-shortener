name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve app version
        id: version
        run: |
          VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved project.version=${VERSION}"

      - name: Compile and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Dashboard unit tests
        working-directory: dashboard
        run: |
          npm ci
          npm test

      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Build Docker image
        run: |
          docker build \
            --tag "ai-proficient-url-shortener:${{ steps.version.outputs.version }}" \
            --tag "ai-proficient-url-shortener:${{ github.sha }}" \
            .
