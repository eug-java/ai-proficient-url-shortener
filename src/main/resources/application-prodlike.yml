# Production-like profile for Docker Compose and staging.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USERNAME:shortener}
    password: ${DB_PASSWORD:shortener}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  security:
    enabled: true
    jwt:
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/shortener}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/shortener/protocol/openid-connect/certs}
  cache.enabled: true
  messaging.mode: kafka
  legacy-unscoped-api.enabled: false
  kafka.clicks-topic: ${CLICKS_TOPIC:shortener.clicks.v1}
  rate-limit:
    enabled: true
    requests: ${RATE_LIMIT_REQUESTS:60}
    window: ${RATE_LIMIT_WINDOW:PT1M}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  geo:
    maxmind-db: ${GEO_MAXMIND_DB:}
  keycloak.admin:
    enabled: ${KEYCLOAK_ADMIN_ENABLED:true}
    server-url: ${KEYCLOAK_ADMIN_URL:http://keycloak:8081}
    realm: ${KEYCLOAK_REALM:shortener}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:shortener-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:shortener-admin-secret}
    invite-client-id: ${KEYCLOAK_INVITE_CLIENT_ID:shortener-dashboard}
    invite-redirect-uri: ${KEYCLOAK_INVITE_REDIRECT_URI:http://localhost:3001/}
    send-invite-email: ${KEYCLOAK_SEND_INVITE_EMAIL:false}

management:
  endpoints.web.exposure.include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  endpoint:
    prometheus:
      access: unrestricted
