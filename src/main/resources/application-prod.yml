# Production-oriented profile. Set SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data.redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  base-url: ${BASE_URL}
  security:
    enabled: true
    jwt:
      issuer-uri: ${OIDC_ISSUER_URI}
      jwk-set-uri: ${OIDC_JWK_SET_URI}
  cache.enabled: true
  messaging.mode: kafka
  legacy-unscoped-api.enabled: false
  analytics.ip-hash-pepper: ${IP_HASH_PEPPER}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rate-limit.enabled: true

management:
  endpoints.web.exposure.include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.example.shortener: INFO
