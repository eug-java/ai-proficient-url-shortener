# Activated automatically by src/test/resources/application.yml.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USERNAME:shortener}
    password: ${DB_PASSWORD:shortener}

management:
  endpoints.web.exposure.include: health

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: WARN
    com.example.shortener: INFO
    org.testcontainers: INFO
