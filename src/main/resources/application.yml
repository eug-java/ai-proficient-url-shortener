spring:
  application:
    name: ai-proficient-url-shortener
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: shortener-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.shortener.messaging
        spring.json.value.default.type: com.example.shortener.messaging.ClickMessage
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  base-url: ${BASE_URL:http://localhost:8080}
  short-code-length: ${SHORT_CODE_LENGTH:7}
  alias-generation-attempts: ${ALIAS_GENERATION_ATTEMPTS:5}
  security:
    enabled: ${SECURITY_ENABLED:true}
    jwt:
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/shortener}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/shortener/protocol/openid-connect/certs}
  cache.enabled: ${CACHE_ENABLED:true}
  messaging.mode: ${MESSAGING_MODE:kafka}
  kafka.clicks-topic: ${CLICKS_TOPIC:shortener.clicks.v1}
  kafka.outbox-poll-ms: ${OUTBOX_POLL_MS:1000}
  analytics.ip-hash-pepper: ${IP_HASH_PEPPER:change-me}
  legacy-unscoped-api.enabled: ${LEGACY_UNSCOPED_API:false}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests: ${RATE_LIMIT_REQUESTS:60}
    window: ${RATE_LIMIT_WINDOW:PT1M}
  retention.enabled: ${RETENTION_ENABLED:true}

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
  metrics:
    tags.application: ${spring.application.name}
    distribution:
      percentiles-histogram.shortener.redirect.duration: true
      slo.shortener.redirect.duration: 10ms,50ms,100ms,250ms,500ms

server.error.include-message: never

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"
  level:
    root: INFO
    com.example.shortener: INFO

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
