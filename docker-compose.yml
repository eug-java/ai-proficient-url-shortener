services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: shortener-prodlike-cluster-01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 25s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak/shortener-realm.json:/opt/keycloak/data/import/shortener-realm.json:ro
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prodlike
      DB_URL: jdbc:postgresql://postgres:5432/shortener
      DB_USERNAME: shortener
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shortener}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BASE_URL: http://localhost:8088
      OIDC_ISSUER_URI: http://localhost:8081/realms/shortener
      OIDC_JWK_SET_URI: http://keycloak:8081/realms/shortener/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:3000
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:-compose-dev-pepper}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      KEYCLOAK_ADMIN_ENABLED: "true"
      KEYCLOAK_ADMIN_URL: http://keycloak:8081
      KEYCLOAK_ADMIN_CLIENT_ID: shortener-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-shortener-admin-secret}
      KEYCLOAK_INVITE_REDIRECT_URI: http://localhost:3001/
      KEYCLOAK_SEND_INVITE_EMAIL: "false"
    ports: ["8088:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: http://localhost:8088
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: shortener
        VITE_KEYCLOAK_CLIENT_ID: shortener-dashboard
    ports: ["3001:80"]
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
