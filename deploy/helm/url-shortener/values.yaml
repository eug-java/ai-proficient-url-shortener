replicaCount: 2

image:
  repository: ai-proficient-url-shortener
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  hosts:
    - host: shortener.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

env:
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:postgresql://postgres:5432/shortener
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OIDC_ISSUER_URI: https://auth.example.com/realms/shortener
  OIDC_JWK_SET_URI: http://keycloak:8081/realms/shortener/protocol/openid-connect/certs
  BASE_URL: https://shortener.example.com
  CORS_ALLOWED_ORIGINS: https://app.example.com

probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
